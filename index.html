<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244A30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Legacy">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>window.LEGACY_VIEWER=true;</script>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.top{top:0!important;padding-top:calc(10px + env(safe-area-inset-top,0px))!important}
.list{top:calc(59px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.list{top:calc(100px + env(safe-area-inset-top,0px))}}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head><body>
<title>The Legacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
:root{
  --green:#244A30; --green-2:#1B3924; --gold:#C4A052; --gold-soft:#E9DDBE;
  --bg:#EEF1ED; --surface:#FFFFFF; --surface-2:#F6F8F5; --line:#DCE2DB; --line-2:#C9D2C8;
  --ink:#16241A; --muted:#5E6B62; --faint:#8C978F;
  --focus:#C4A052; --danger:#A3392B; --ok:#2F6B45; --warn:#9A6B12;
  --chip-draft:#E7EAE6; --chip-sent:#EFE6CF; --chip-paid:#DDEBDF; --chip-late:#F3DCD6;
  --shadow:0 1px 2px rgba(22,36,26,.06),0 8px 24px rgba(22,36,26,.06);
  --serif:"Cormorant Garamond","Cormorant","Baskerville","Garamond","Hoefler Text","Times New Roman",serif;
  --sans:"Hanken Grotesk","Helvetica Neue","Avenir Next",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1511; --surface:#151F18; --surface-2:#1A261D; --line:#26352A; --line-2:#32443A;
    --ink:#E6EBE6; --muted:#A3AEA6; --faint:#76827A;
    --chip-draft:#243029; --chip-sent:#3A3220; --chip-paid:#1F3A28; --chip-late:#4A2620;
    --danger:#E0806F; --ok:#7FC597; --warn:#E0B458;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#151F18; --surface-2:#1A261D; --line:#26352A; --line-2:#32443A;
  --ink:#E6EBE6; --muted:#A3AEA6; --faint:#76827A;
  --chip-draft:#243029; --chip-sent:#3A3220; --chip-paid:#1F3A28; --chip-late:#4A2620;
  --danger:#E0806F; --ok:#7FC597; --warn:#E0B458;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--green);color:#F3EEDF;
  display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid rgba(196,160,82,.35)}
.top .brand{display:flex;align-items:center;gap:14px;min-width:0}
.top .brand img{height:38px;width:auto;display:block}
.top .brand .sep{width:1px;height:26px;background:rgba(196,160,82,.45)}
.top .brand span{font:500 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft);white-space:nowrap}
/* ---------- home ---------- */
#home{display:none;position:fixed;inset:0;z-index:60;background:var(--green-2);color:#F3EEDF;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
body.home-on #home{display:flex;flex-direction:column}
body.home-on{overflow:hidden}
#home .hw{margin:auto;width:min(860px,100%);display:flex;flex-direction:column;align-items:center}
#home .hlogo{width:min(150px,40vw);height:auto;display:block;opacity:.95}
#home .htitle{margin-top:22px;font:400 9px/1 var(--sans);letter-spacing:.42em;text-transform:uppercase;color:rgba(233,221,190,.55);padding-left:.42em}
#home .hnav{display:flex;width:100%;margin-top:64px;border-top:1px solid rgba(196,160,82,.22);border-bottom:1px solid rgba(196,160,82,.22)}
#home .hl{appearance:none;flex:1;background:none;border:0;color:inherit;cursor:pointer;padding:26px 8px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;transition:color .3s}
#home .hl+.hl{border-left:1px solid rgba(196,160,82,.22)}
#home .hl i{font:400 9px/1 var(--sans);font-style:normal;letter-spacing:.3em;color:rgba(196,160,82,.7)}
#home .hl b{font:400 21px/1 var(--serif);letter-spacing:.04em;color:#F3EEDF;transition:color .3s}
#home .hl::after{content:"";position:absolute;left:50%;bottom:14px;width:0;height:1px;background:var(--gold);transition:width .35s ease,left .35s ease}
#home .hl:hover b,#home .hl:focus-visible b{color:var(--gold-soft)}
#home .hl:hover::after,#home .hl:focus-visible::after{width:28px;left:calc(50% - 14px)}
#home .hstat{margin-top:auto;padding-top:40px;font:400 9px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:rgba(243,238,223,.3);text-align:center;min-height:14px}
@media (max-width:640px){
  #home .hnav{flex-direction:column;margin-top:52px}
  #home .hl{flex-direction:row;justify-content:flex-start;gap:18px;padding:19px 4px}
  #home .hl+.hl{border-left:0;border-top:1px solid rgba(196,160,82,.22)}
  #home .hl b{font-size:20px}
  #home .hl::after{content:"→";position:static;width:auto;height:auto;background:none;margin-left:auto;font:300 14px/1 var(--sans);color:rgba(196,160,82,.6)}
  #home .hl:hover::after{width:auto}
}
.top .brand{cursor:pointer}
.top .grow{flex:1}
.top .save{font-size:12px;color:rgba(243,238,223,.7);white-space:nowrap}
.tbtn{border:1px solid rgba(196,160,82,.5);background:transparent;color:#F3EEDF;border-radius:999px;padding:7px 14px;font-size:13px;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tbtn:hover{background:rgba(196,160,82,.14)}
.tbtn.solid{background:var(--gold);color:#1B2A1F;border-color:var(--gold);font-weight:600}
.tbtn.solid:hover{background:#D1B066}
.tbtn svg{width:15px;height:15px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:290px minmax(400px,1fr) minmax(430px,1.05fr);height:calc(100% - 59px)}
.pane{overflow:auto;min-height:0}
.list{border-right:1px solid var(--line);background:var(--surface-2);padding:18px 16px 40px}
.editor{padding:22px 26px 80px}
.preview{border-left:1px solid var(--line);background:var(--bg);padding:22px 24px 60px;display:flex;flex-direction:column;gap:14px}
.tabs{display:none}

/* list */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.summary{display:grid;gap:10px;margin:16px 0 18px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sum .v{font:500 20px/1.25 var(--serif);font-variant-numeric:tabular-nums;margin-top:4px}
.sum .v small{font:12px var(--sans);color:var(--muted)}
.lh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 2px 8px;display:flex;justify-content:space-between}
.inv-list{display:flex;flex-direction:column;gap:6px}
.inv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:10px 12px;width:100%}
.inv:hover{background:var(--surface)}
.inv.on{background:var(--surface);border-color:var(--line-2);box-shadow:var(--shadow)}
.inv .n{font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.inv .c{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv .a{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--chip-draft);color:var(--ink);white-space:nowrap;justify-self:end}
.chip.sent{background:var(--chip-sent)} .chip.partial{background:var(--chip-sent);box-shadow:inset 0 0 0 1px var(--gold)} .chip.paid{background:var(--chip-paid)} .chip.late{background:var(--chip-late)}
.empty{color:var(--muted);font-size:13px;padding:14px 4px}

/* editor */
.ehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ehead h1{font:500 32px/1.05 var(--serif);margin:0;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.ehead .sub{color:var(--muted);font-size:13px;margin-top:4px}
.eacts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--gold)}
.btn.danger{color:var(--danger)}
.btn.danger.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.primary{background:var(--green);color:#F3EEDF;border-color:var(--green)}
.btn.primary:hover{background:var(--green-2)}
.btn svg{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;margin-bottom:16px}
.card h2{font:600 10.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:11.5px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:62px;line-height:1.4}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);outline:none;background:var(--surface)}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pick{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px;font:13px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink);max-width:60%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--green);color:#F3EEDF}

/* items */
.items{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:92px 1fr;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.item.svc{grid-template-columns:1fr}
.ph{width:92px;height:92px;border-radius:6px;border:1px dashed var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--faint);font-size:11px;text-align:center;position:relative;overflow:hidden;padding:0}
.ph:hover{border-color:var(--gold);color:var(--ink)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:20px;height:20px}
.phwrap{display:flex;flex-direction:column;gap:6px;align-items:center}
.item>.pickline{grid-column:1/-1;justify-self:start;color:var(--green);border-color:var(--gold)}
:root[data-theme="dark"] .item>.pickline{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .item>.pickline{color:var(--gold)}}
.lnk{border:0;background:none;color:var(--muted);font-size:11.5px;padding:0;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:var(--danger)}
.ibody .grid{gap:10px}
.itop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.itag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.itools{display:flex;gap:4px}
.ic{border:1px solid transparent;background:transparent;border-radius:6px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ic:hover{border-color:var(--line-2);color:var(--ink)}
.ic svg{width:14px;height:14px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.totals{margin-top:14px;display:grid;justify-content:end;gap:4px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:40px;font-size:13px;color:var(--muted)}
.totals .t{color:var(--ink);font:500 22px/1.2 var(--serif);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.warn{font-size:12px;color:var(--warn)}

/* preview */
.pvbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pvbar .lbl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.pvwrap{width:100%;position:relative}
.pvscale{transform-origin:top left;position:absolute;top:0;left:0}
.pvshadow{box-shadow:0 2px 6px rgba(0,0,0,.08),0 18px 50px rgba(20,40,26,.16)}
.msg{font-size:12.5px;color:var(--muted)}
.msg.err{color:var(--danger)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,18,12,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{width:min(560px,100%);height:100%;background:var(--surface);overflow:auto;padding:22px 22px 0;box-shadow:var(--shadow)}
.sheet h1{font:500 28px/1.1 var(--serif);margin:0 0 4px}
.sheet .sub{color:var(--muted);margin-bottom:18px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sfoot{position:sticky;bottom:0;margin:8px -22px 0;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- the invoice paper (fixed document colours) ---------- */
.paper{width:794px;min-height:1123px;background:#FFFFFF;color:#1C261F;font:11.5px/1.5 var(--sans);position:relative;display:flex;flex-direction:column}
.paper *{box-sizing:border-box}
.pp-band{background:#244A30;height:150px;display:flex;align-items:center;justify-content:center;position:relative}
.pp-band img{height:92px;width:auto}
.pp-band::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:#C4A052}
.paper.light .pp-band{background:#FFFFFF;height:150px;border-bottom:0}
.paper.light .pp-band::after{left:56px;right:56px;bottom:0}
.paper.edge .pp-band,.paper.gold .pp-band,.paper.frame .pp-band{background:#FFFFFF}
.paper.edge{border-top:9px solid #244A30}
.paper.edge .pp-band{height:141px}
.paper.edge .pp-band::after{left:56px;right:56px;bottom:0}
.paper.gold .pp-band::after{left:calc(50% - 40px);right:calc(50% - 40px);bottom:4px;background:#244A30}
.paper.frame::before{content:"";position:absolute;inset:16px;border:1px solid #C4A052;pointer-events:none}
.paper.frame::after{content:"";position:absolute;inset:20px;border:.5px solid rgba(36,74,48,.35);pointer-events:none}
.paper.frame .pp-band{height:156px;align-items:flex-end;padding-bottom:6px}
.paper.frame .pp-band::after{display:none}
.paper.frame .pp-bottom{margin-bottom:22px}
.pp-in{padding:44px 56px 0;flex:1;display:flex;flex-direction:column}
.pp-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
.pp-title{font:500 34px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;color:#244A30;margin:0}
.pp-no{margin-top:10px;font-variant-numeric:tabular-nums;color:#3E4A42;display:grid;grid-template-columns:auto auto;gap:3px 18px}
.pp-no dt{color:#8A8F86;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding-top:2px}
.pp-no dd{margin:0}
.pp-stamp{border:1.5px solid #C4A052;color:#A8863C;font:600 11px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;padding:9px 12px 8px 15px;border-radius:2px;transform:rotate(-4deg);margin-top:6px;display:inline-block}
.pp-parties{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px;padding-top:22px;border-top:1px solid #E4E0D4}
.pp-h{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#A8863C;margin-bottom:7px}
.pp-party b{font-weight:600;font-size:12.5px;color:#1C261F;display:block;margin-bottom:2px}
.pp-party{white-space:pre-line;color:#4A554D}
.pp-table{margin-top:34px}
.pp-th{display:grid;grid-template-columns:1fr 46px 118px 118px;gap:14px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8A8F86;padding-bottom:9px;border-bottom:1px solid #244A30}
.pp-row{display:grid;grid-template-columns:1fr 46px 118px 118px;gap:14px;padding:16px 0;border-bottom:1px solid #ECE9E0;align-items:start}
.pp-r{text-align:right;font-variant-numeric:tabular-nums}
.pp-desc{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.pp-thumb{width:68px;height:68px;object-fit:cover;display:block;border:1px solid #E4E0D4;padding:3px;background:#fff}
.pp-artist{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#1C261F}
.pp-work{font:400 16px/1.25 var(--serif);color:#1C261F;margin-top:2px}
.pp-work i{font-style:italic}
.pp-spec{color:#5E6660;margin-top:4px;white-space:pre-line}
.pp-ref{color:#8A8F86;font-size:10.5px;margin-top:3px;letter-spacing:.02em}
.pp-svc{font:400 15px/1.3 var(--serif);color:#1C261F}
.pp-tot{display:flex;justify-content:flex-end;margin-top:18px}
.pp-tot table{border-collapse:collapse;min-width:300px;font-variant-numeric:tabular-nums}
.pp-tot td{padding:5px 0;color:#4A554D}
.pp-tot td+td{text-align:right;padding-left:30px}
.pp-tot tr.g td{border-top:1px solid #244A30;padding-top:12px;color:#244A30}
.pp-tot tr.g td:first-child{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;vertical-align:middle}
.pp-tot tr.g td+td{font:500 26px/1 var(--serif)}
.pp-tot tr.pd td{padding-top:10px}
.pp-tot tr.bd td{border-top:1px solid #E4E0D4;padding-top:8px;color:#244A30;font-weight:600}
.pp-vatnote{text-align:right;color:#8A8F86;font-size:10px;margin-top:10px;margin-left:auto;max-width:380px;line-height:1.5}
.pp-foot{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;margin-top:40px;padding-top:22px;border-top:1px solid #E4E0D4}
.pp-bank{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;color:#3E4A42;font-variant-numeric:tabular-nums}
.pp-bank dt{color:#8A8F86;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding-top:2px}
.pp-bank dd{margin:0}
.pp-terms{color:#5E6660;white-space:pre-line;font-size:10.5px;line-height:1.55}
.pp-spacer{flex:1;min-height:40px}
.paper.compact .pp-band{height:112px}
.paper.compact .pp-band img{height:74px}
.paper.compact .pp-in{padding-top:26px}
.paper.compact .pp-parties{margin-top:20px;padding-top:14px}
.paper.compact .pp-table{margin-top:20px}
.paper.compact .pp-row{padding:10px 0}
.paper.compact .pp-th,.paper.compact .pp-row{grid-template-columns:1fr 34px 92px 92px;gap:12px}
.paper.compact .pp-meta .pp-title{font-size:30px}
.paper.compact .pp-parties{gap:32px}
.paper.compact{line-height:1.42}
.paper.compact .pp-terms{line-height:1.45}
.paper.compact .pp-band{height:100px}
.paper.compact .pp-band img{height:68px}
.paper.compact .pp-no{margin-top:8px}

.vw{width:96px;height:96px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vw img{width:100%;height:100%;object-fit:cover;display:block}
.vw:hover{border-color:var(--gold)}
.vw{position:relative}
.vw.pick{opacity:.55}
.vw.pick.on{opacity:1;border:2px solid var(--gold)}
.vw.primary{border:2px solid var(--gold)}
.pbadge{position:absolute;left:4px;bottom:4px;background:var(--green);color:#F3EEDF;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:999px}
.vw.add{border-style:dashed;flex-direction:column;gap:4px;color:var(--muted);font-size:11.5px}
.vw.add svg{width:22px;height:22px}
.ov.lb{justify-content:center;align-items:center;padding:16px}
.lbox{background:var(--surface);border-radius:14px;padding:14px;max-width:min(920px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.lbox img{max-width:100%;max-height:calc(100vh - 160px);object-fit:contain;border-radius:6px;background:var(--surface-2)}
.hist{display:flex;flex-direction:column;gap:4px}
.hrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%}
.hrow:hover{border-color:var(--gold)}
.hrow .n{font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.hrow .c{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .a{font-variant-numeric:tabular-nums;font-size:12.5px}
.linked{font-size:12px;color:var(--ok);display:inline-flex;gap:6px;align-items:center}
@media (max-width:1100px){ .nav{margin-left:0} }
@media (max-width:900px){
  .top{flex-wrap:wrap}
  .nav{order:10;width:100%;justify-content:center;margin:2px 0 0}
  .app,.alt{height:auto}
  .alt{grid-template-columns:1fr}
  .side{border-right:0;padding:16px}
  .detail{padding:16px 16px 80px}
  body:not(.alt-detail) .detail{display:none}
  body.alt-detail .side{display:none}
  .backbtn{display:inline-flex}
  .artcard{grid-template-columns:1fr}
  .hrow{grid-template-columns:1fr auto}
  .hrow .c{grid-column:1/-1;order:3}
  .list{top:100px}
}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => new Date().toISOString().slice(0,10);
const addDays = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+Number(n||0)); return d.toISOString().slice(0,10); };
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const num = v => { const n=parseFloat(String(v??"").replace(/\s/g,"").replace(/,/g,".")); return isFinite(n)?n:0; };
function money(n,cur,lang){ try{ return new Intl.NumberFormat(T[lang||"en"].locale,{style:"currency",currency:cur||"USD",minimumFractionDigits:2}).format(n||0);}catch(e){return (cur||"")+" "+(n||0).toFixed(2);} }
function fdate(iso,lang){ if(!iso) return ""; const d=new Date(iso+"T12:00:00"); if(isNaN(d)) return iso; return d.toLocaleDateString(T[lang||"en"].locale,{day:"numeric",month:"long",year:"numeric"}); }
function frac8(cm){ const n=Math.round(cm/2.54*8); const w=Math.floor(n/8), f=n%8; const F=["","1/8","1/4","3/8","1/2","5/8","3/4","7/8"][f]; return (w? String(w):"")+(F?(w?" ":"")+F:"") || "0"; }
function withInches(dim, on){
  if(!on||!dim||/\bin\b|inch|″|"/i.test(dim)) return dim||"";
  const m = dim.match(/(\d+(?:[.,]\d+)?)\s*[x×]\s*(\d+(?:[.,]\d+)?)(?:\s*[x×]\s*(\d+(?:[.,]\d+)?))?\s*cm/i);
  if(!m) return dim;
  const parts=[m[1],m[2],m[3]].filter(Boolean).map(v=>frac8(num(v)));
  return dim.trim()+" ("+parts.join(" × ")+" in.)";
}
function discountOf(base, mode, value){ const v=num(value); if(!v||!base) return 0; return Math.min(base, (mode||"pct")==="pct"? base*v/100 : v); }
function totals(inv){
  const sub = (inv.items||[]).reduce((s,it)=>s+num(it.qty||1)*num(it.price),0);
  const disc = Math.min(num(inv.discount), sub);
  const base = sub-disc;
  const vat = vatModeOf(inv)==="standard" ? base*num(inv.vatRate)/100 : 0;
  return {sub,disc,base,vat,total:base+vat};
}
const VAT_MODES=[["none","Sans TVA · société non enregistrée"],["standard","TVA 5 % · vente aux Émirats"],["export","Export · hors taxe (taux zéro)"]];
function vatModeOf(inv){ return inv.vatMode || (num(inv.vatRate)>0?"standard":"none"); }
function paymentsOf(inv){ return (inv.payments||[]).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")); }
function paidOf(inv){ const p=(inv.payments||[]).reduce((s,x)=>s+num(x.amount),0); if(!p && inv.status==="paid") return totals(inv).total; return p; }
function balanceOf(inv){ return Math.max(0, Math.round((totals(inv).total-paidOf(inv))*100)/100); }
function statusOf(inv){
  if((inv.status||"draft")==="draft") return "draft";
  const t=totals(inv).total, p=paidOf(inv);
  if(inv.status==="paid" || (t>0 && p>=t-0.005)) return "paid";
  if(p>0) return "partial";
  if(inv.due && inv.due<today()) return "late";
  return "sent";
}
function bankFor(cur){
  const c=state.company, b=(c.banks||{})[cur]||{};
  return {bankName:b.bankName||c.bankName||"", accountName:b.accountName||c.accountName||c.name||"", accountNo:b.accountNo||"", iban:b.iban||"", swift:b.swift||""};
}
function mergeCompany(d){ const c=Object.assign(clone(DEFAULT_COMPANY),d||{}); if(!Array.isArray(c.locations)) c.locations=clone(DEFAULT_COMPANY.locations); c.banks=Object.assign({USD:EMPTY_BANK(),EUR:EMPTY_BANK(),AED:EMPTY_BANK()},(d&&d.banks)||{}); return c; }

const idb = {
  _db:null,
  open(){ if(this._db) return Promise.resolve(this._db); return new Promise((res,rej)=>{ try{ const r=indexedDB.open("ls-invoicing",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>{ this._db=r.result; res(r.result); }; r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  async get(k){ const d=await this.open(); return new Promise((res,rej)=>{ const q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async set(k,v){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
};
const local = {
  async read(){
    try{ const v=await idb.get("data"); if(v) return v; }catch(e){}
    try{ return JSON.parse(localStorage.getItem("ls-invoicing")||"null"); }catch(e){ return null; }
  },
  async write(){
    const data={company:state.company, invoices:state.invoices, contacts:state.contacts, artworks:state.artworks, views:state.views||{}, expenses:state.expenses||{}};
    try{ await idb.set("data", JSON.parse(JSON.stringify(data))); return; }catch(e){}
    try{ localStorage.setItem("ls-invoicing", JSON.stringify(data)); }catch(e){ setTimeout(()=>setSave("Stockage de cet appareil plein : exportez une sauvegarde",true),0); throw e; }
  }
};
async function putInvoice(inv){ if(db) await db.collection("invoices").doc(inv.id).set(inv); else await local.write(); }
async function removeInvoice(id){ if(db) await db.collection("invoices").doc(id).delete(); else await local.write(); }
async function putCompany(){ if(VIEWER) return; if(db) await db.doc("settings/company").set(state.company); else await local.write(); }

function setSave(t,err){ const el=$("#saveState"); el.textContent=t; el.style.color = err? "#F0A898":""; const hs=document.getElementById("homeStat"); if(hs) hs.textContent=t; }
function scheduleSave(id){ if(VIEWER) return; clearTimeout(timers[id]); setSave("Modifications…"); timers[id]=setTimeout(()=>{ delete timers[id]; flush(id); },700); }
async function flush(id){
  if(VIEWER) return;
  if(inflight[id]){ again[id]=true; return; }
  const inv=state.invoices[id]; if(!inv) return;
  inflight[id]=true;
  try{ inv.updatedAt=new Date().toISOString(); await putInvoice(clone(inv)); setSave(db?"Enregistré":"Enregistré sur cet appareil"); }
  catch(e){ setSave(e && e.code==="quota_exceeded" ? "Stockage plein" : (e&&e.code==="invalid_argument" ? "Facture trop lourde : retirez une photo" : "Échec de l’enregistrement"), true); }
  finally{ inflight[id]=false; if(again[id]){ again[id]=false; flush(id); } }
}
const pending = id => !!(timers[id]||inflight[id]);

/* ---------------- numbering ---------------- */
function nextNumber(){
  const y=new Date().getFullYear(), p=(state.company.prefix||"INV").trim();
  const re=new RegExp("^"+p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"-"+y+"-(\\d+)$");
  let max=0; Object.values(state.invoices).forEach(i=>{ const m=(i.number||"").match(re); if(m) max=Math.max(max,+m[1]); });
  return `${p}-${y}-${String(max+1).padStart(3,"0")}`;
}
function newInvoice(){
  const c=state.company, d=today();
  return { id:uid(), number:nextNumber(), date:d, due:addDays(d,c.payDays), status:"draft", paidDate:"",
    lang:c.lang||"en", currency:c.currency||"USD", vatMode: c.vatRegistered? "standard":"none", vatRate: c.vatRegistered? num(c.vatRate):0, discount:0,
    client:{name:"",company:"",address:"",email:"",trn:""},
    items:[{id:uid(),kind:"art",photo:"",artist:"",title:"",year:"",medium:"",dimensions:"",ref:"",notes:"",qty:1,price:""}],
    terms:defTerms(c.lang||"en",c.payDays), reference:"", createdAt:new Date().toISOString() };
}

const fld = (label,path,val,cls="s2",opts={}) => {
  const id="f_"+path.replace(/\./g,"_");
  const a=`id="${id}" data-p="${path}" ${opts.list?`list="${opts.list}"`:""} ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}`;
  let inp;
  if(opts.area) inp=`<textarea ${a} rows="${opts.rows||3}">${esc(val)}</textarea>`;
  else if(opts.select) inp=`<select ${a}>${opts.select.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(val)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
  else inp=`<input ${a} type="${opts.type||"text"}" value="${esc(val)}" ${opts.num?'class="num" inputmode="decimal"':""}>`;
  return `<div class="f ${cls}"><label for="${id}">${label}</label>${inp}</div>`;
};

function setPath(obj,path,val){ const k=path.split("."); let o=obj; for(let i=0;i<k.length-1;i++){ o=o[isNaN(k[i])?k[i]:+k[i]]; } o[k[k.length-1]]=val; }

let pvRaf=0, confirmOver=false;
function stBar(inv){
  const s=statusOf(inv), step=s==="draft"?0:s==="paid"?2:1, cur=inv.currency||"USD", m=v=>esc(money(v,cur,"en"));
  const steps=[["Brouillon"],[s==="partial"?"Paiement partiel":"Envoyée"],["Payée"]].map(([l],i)=>`<span class="st-step ${i<step?"done":""} ${i===step?"on":""}">${l}</span>`).join('<i class="st-sep"></i>');
  const pays=paymentsOf(inv), paid=paidOf(inv), bal=balanceOf(inv), tot=totals(inv).total;
  const overdue=inv.due && inv.due<today() && s!=="paid" && s!=="draft";
  let act="";
  if(s==="draft") act=`<button type="button" class="btn primary" data-setst="sent">Marquer comme envoyée</button>`;
  else if(s!=="paid") act=`${overdue?`<span class="st-late">En retard depuis le ${esc(fdate(inv.due,"fr"))}</span>`:""}<button type="button" class="btn" data-payform>+ Paiement reçu</button><button type="button" class="btn primary" data-setst="paid">Marquer comme payée</button>${pays.length?"":`<button type="button" class="st-link" data-setst="draft">Repasser en brouillon</button>`}`;
  else act=`<span class="st-paid">Payée le ${esc(fdate(inv.paidDate||today(),"fr"))}</span>${pays.length?"":`<button type="button" class="st-link" data-setst="sent">Annuler le paiement</button>`}`;
  const list=pays.length?`<div class="pay-list">${pays.map(x=>`<div class="pay-row"><span>${esc(fdate(x.date,"fr"))}</span><span>${m(num(x.amount))}</span><span class="pay-note">${esc(x.note||"")}</span>${VIEWER?"":`<button type="button" class="st-link pay-del" data-paydel="${x.id}" aria-label="Supprimer ce paiement">Supprimer</button>`}</div>`).join("")}</div>`:"";
  const sum=(s!=="draft" && (pays.length||s==="partial"))?`<div class="pay-sum"><span>Total <b>${m(tot)}</b></span><span>Reçu <b>${m(paid)}</b></span><span class="${bal>0?"due":"ok"}">Reste à payer <b>${m(bal)}</b></span></div>`:"";
  const form=`<div class="pay-form" id="payForm" hidden>
      <div class="f"><label for="payDate">Date de réception</label><input id="payDate" type="date" value="${today()}"></div>
      <div class="f"><label for="payAmt">Montant reçu (${esc(cur)})</label><input id="payAmt" class="num" inputmode="decimal" value="${bal||""}"></div>
      <div class="f pay-n"><label for="payNote">Note (facultatif)</label><input id="payNote" placeholder="Virement, acompte…"></div>
      <div class="pay-btns"><button type="button" class="btn primary" data-paysave>Enregistrer le paiement</button><button type="button" class="btn" data-paycancel>Annuler</button></div>
      <div class="pay-hint" id="payHint"></div></div>`;
  return `<div class="stbar"><div class="st-top"><div class="st-steps">${steps}</div><div class="st-act">${act}</div></div>${sum}${list}${VIEWER?"":form}</div>`;
}
function syncPaidStatus(inv){
  const pays=paymentsOf(inv), t=totals(inv).total, p=pays.reduce((a,x)=>a+num(x.amount),0);
  if(pays.length && t>0 && p>=t-0.005){ inv.status="paid"; inv.paidDate=pays[pays.length-1].date; }
  else if(inv.status==="paid" && pays.length){ inv.status="sent"; inv.paidDate=""; }
  else if(inv.status==="draft" && pays.length){ inv.status="sent"; }
}
function touch(opts={}){
  const inv=state.invoices[state.current]; if(!inv) return;
  scheduleSave(inv.id);
  cancelAnimationFrame(pvRaf); pvRaf=requestAnimationFrame(()=>{ renderPreview(); renderList(); });
  if(opts.editor) renderEditor(); else renderEdTotals();
}

document.addEventListener("input",e=>{
  const p=e.target.dataset?.p; if(!p) return;
  const inv=state.invoices[state.current]; if(!inv) return;
  setPath(inv,p,e.target.value);
  if(p==="client.name" && !inv.contactId){ const ct=sortedContacts().find(c=>c.name && c.name===e.target.value); if(ct){ inv.client=clientFromContact(ct); inv.contactId=ct.id; touch({editor:true}); return; } }
  if(p==="client.name"){ const src=clientNames()[e.target.value]; if(src && src!==inv.client && !inv.client.address){ Object.assign(inv.client,clone(src)); touch({editor:true}); return; } }
  if(p==="date" && inv.date){ /* keep due offset */ }
  touch();
});
document.addEventListener("change",e=>{
  const p=e.target.dataset?.p; if(!p) return;
  const inv=state.invoices[state.current]; if(!inv) return;
  if(p==="status"){ if(inv.status==="paid" && !inv.paidDate) inv.paidDate=today(); touch({editor:true}); }
  if(p==="date"){ inv.due=addDays(inv.date,state.company.payDays); touch({editor:true}); }
  if(p==="vatMode"){ inv.vatRate = inv.vatMode==="standard" ? (num(state.company.vatRate)||5) : 0; touch({editor:true}); }
});

/* ---------------- file download (Claude or standalone) ---------------- */
const STANDALONE = !(window.claude && window.claude.use);
async function saveFile(name, blob){
  if(downloads){ await downloads.save({filename:name,data:blob}); return "saved"; }
  if(STANDALONE){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); return "saved"; }
  throw {code:"unavailable"};
}
/* ---------------- PDF export ---------------- */
function printPdf(inv){
  const safe=s=>String(s||"").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim();
  const old=document.title; document.title=`${safe(inv.number)}${inv.client?.name?" - "+safe(inv.client.name):""}`;
  $("#printArea").innerHTML=paperFor(inv);
  const imgs=[...$("#printArea").querySelectorAll("img")];
  Promise.all(imgs.map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;}))).then(()=>{ window.print(); setTimeout(()=>{ document.title=old; $("#printArea").innerHTML=""; },500); });
}
async function exportPdf(){
  const inv=state.invoices[state.current]; if(!inv) return;
  if(STANDALONE && !(window.html2canvas && window.jspdf)){ printPdf(inv); return; }
  const msg=$("#pdfMsg"), btn=$("#btnPdf");
  const say=(t,err)=>{ msg.hidden=!t; msg.textContent=t||""; msg.classList.toggle("err",!!err); };
  if(!window.html2canvas||!window.jspdf){ say("Le module PDF n’a pas pu se charger. Rechargez la page.",true); return; }
  btn.disabled=true; say("Préparation du PDF…");
  try{
    const stage=$("#pdfstage"); stage.innerHTML=paperFor(inv);
    const paper=stage.firstElementChild;
    await document.fonts.ready;
    await Promise.all([...paper.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    const W=794, H=1123, TOP2=48;
    const totalH=paper.offsetHeight;
    const pr=paper.getBoundingClientRect();
    const bottoms=[...paper.querySelectorAll("[data-keep]")].map(el=>{ const r=el.getBoundingClientRect(); return Math.round(r.bottom-pr.top); }).sort((a,b)=>a-b);
    const cuts=[0]; let y=0, first=true;
    while(totalH-y > (first?H:H-TOP2)){
      const lim=y+(first?H:H-TOP2);
      const cand=bottoms.filter(b=>b>y+120 && b<=lim).pop();
      y=cand||lim; cuts.push(y); first=false;
    }
    cuts.push(totalH);
    const SC=2;
    const canvas=await html2canvas(paper,{scale:SC,backgroundColor:"#ffffff",useCORS:true,logging:false,width:W,windowWidth:W});
    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF({unit:"pt",format:"a4",compress:true});
    const PW=pdf.internal.pageSize.getWidth(), PH=pdf.internal.pageSize.getHeight(), k=PW/W;
    for(let p=0;p<cuts.length-1;p++){
      const y0=cuts[p], y1=cuts[p+1], h=y1-y0, off=p?TOP2:0;
      const pc=document.createElement("canvas"); pc.width=W*SC; pc.height=H*SC;
      const cx=pc.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,pc.width,pc.height);
      cx.drawImage(canvas,0,y0*SC,W*SC,h*SC,0,off*SC,W*SC,h*SC);
      if(p) pdf.addPage();
      pdf.addImage(pc.toDataURL("image/jpeg",0.93),"JPEG",0,0,PW,PH);
    }
    pdf.setProperties({title:`${inv.number} — ${state.company.name}`,author:state.company.name,creator:state.company.name,subject:"Invoice"});
    const blob=pdf.output("blob");
    stage.innerHTML="";
    const safe=s=>String(s||"").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim();
    const name=`${safe(inv.number)}${inv.client?.name?" - "+safe(inv.client.name):""}.pdf`;
    try{ await saveFile(name,blob); say(`PDF enregistré : ${name}`); }
    catch(err){ if(err?.code==="declined") say(""); else if(err?.code==="rate_limited") say("Une demande de téléchargement est déjà ouverte.",true); else if(err?.code==="unavailable") say("Le téléchargement n’est pas disponible dans cette vue. Ouvrez la page dans claude.ai.",true); else say("Le téléchargement n’a pas abouti ("+(err?.code||"erreur")+").",true); }
  }catch(err){ console.error(err); say("La génération du PDF a échoué. Réessayez.",true); }
  finally{ btn.disabled=false; }
}

state.contacts={}; state.artworks={}; state.views={}; state.view="invoices"; state.curContact=null; state.curArt=null;
const ART_STATUS={available:"Available",reserved:"Reserved",consignment:"Consignment",nfs:"Not for sale",sold:"Sold"};
const OLD_STATUS={consigned:"consignment"};
const CATEGORIES=[["painting","Painting"],["sculpture","Sculpture"],["photography","Photography"],["installation","Installation"],["paper","Work on paper"],["furniture","Furniture"],["other","Other"]];
const catLabel=k=>(CATEGORIES.find(c=>c[0]===k)||[,""])[1];
const EDITIONS=[["","Non renseigné"],["unique","Unique piece"],["edition","Edition"],["ap","Artist’s proof (AP)"]];
function editionText(a){ if(a.editionType==="unique") return "Unique"; if(a.editionType==="edition") return a.editionNumber?`Edition ${a.editionNumber}`:"Edition"; if(a.editionType==="ap") return a.editionNumber?`AP ${a.editionNumber}`:"Artist’s proof"; return ""; }
const artStatus=a=>ART_STATUS[a.status]?a.status:(OLD_STATUS[a.status]||"available");
const dT={}, dI={}, dA={};
const pendingDoc=(coll,id)=>!!(dT[coll+"/"+id]||dI[coll+"/"+id]);
function schedDoc(coll,id){ if(VIEWER) return; const k=coll+"/"+id; clearTimeout(dT[k]); setSave("Modifications…"); dT[k]=setTimeout(()=>{ delete dT[k]; flushDoc(coll,id); },700); }
async function flushDoc(coll,id){
  if(VIEWER) return;
  const k=coll+"/"+id; if(dI[k]){ dA[k]=true; return; }
  const o=state[coll][id]; if(!o) return; dI[k]=true;
  try{ o.updatedAt=new Date().toISOString(); if(db) await db.collection(coll).doc(id).set(clone(o)); else await local.write(); setSave(db?"Enregistré":"Enregistré sur cet appareil"); }
  catch(e){ setSave(e&&e.code==="invalid_argument"?"Fiche trop lourde : photo à réduire":"Échec de l’enregistrement",true); }
  finally{ dI[k]=false; if(dA[k]){ dA[k]=false; flushDoc(coll,id); } }
}
async function removeDoc(coll,id){ clearTimeout(dT[coll+"/"+id]); delete dT[coll+"/"+id]; delete state[coll][id]; if(db) await db.collection(coll).doc(id).delete(); else await local.write(); }

const newContact=()=>({id:uid(),name:"",company:"",address:"",email:"",phone:"",trn:"",notes:"",createdAt:new Date().toISOString()});

/* rate of an expense, as AED per 1 unit. EUR/GBP/CHF are typed as "1 X = … USD", JPY as "1 USD = … JPY" */
function expFx(e){ const c=e.currency||"USD"; if(c==="AED") return 1; if(c==="USD") return PEG; const r=num(e.fxUsd);
  if(r) return c==="JPY"? PEG/r : r*PEG; return num(e.fx)||0; }
function expPays(e){ return (e.payments||[]).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")); }
function expPaidOf(e){ const p=(e.payments||[]).reduce((s,x)=>s+num(x.amount),0); if(!p && e.status==="paid") return num(e.amount); return p; }
function expBalance(e){ return Math.max(0, Math.round((num(e.amount)-expPaidOf(e))*100)/100); }
function expStatus(e){ const a=num(e.amount), p=expPaidOf(e); if(e.status==="paid" || (a>0 && p>=a-0.005)) return "paid"; if(p>0) return "partial"; if(e.due && e.due<today()) return "late"; return "due"; }
function expSync(e){ const a=num(e.amount), p=(e.payments||[]).reduce((s,x)=>s+num(x.amount),0); if((e.payments||[]).length){ e.status = (a>0 && p>=a-0.005)? "paid" : "due"; } }
const inYear=d=>acctYear==="all"||(d||"").startsWith(acctYear);
function invBaseAED(i){ return toAED(totals(i).base,i.currency,i.fxAED); }
function invTotalAED(i){ return toAED(totals(i).total,i.currency,i.fxAED); }
function expAED(e){ const f=expFx(e); return f? num(e.amount)*f : null; }
function expBalAED(e){ const f=expFx(e); return f? expBalance(e)*f : null; }
function invLabel(i){ return `${i.number||"Sans numéro"}${i.client?.name||i.client?.company?" · "+(i.client.name||i.client.company):""}`; }

/* cost lines of one sale (invoice): linked expenses + artwork purchase/commission fallbacks */
function opOf(inv){
  const cur=inv.currency||"USD", rate=inv.fxAED, rev=totals(inv).base, lines=[]; let missing=false;
  const push=(label,src,amount,c,r,expId)=>{ const v=convCur(amount,c,r,cur,rate); if(v===null) missing=true; lines.push({label,src,amount:num(amount),cur:c,conv:v,expId}); };
  const exps=sortedExpenses(), used=new Set();
  exps.filter(e=>e.invoiceId===inv.id).forEach(e=>{ used.add(e.id); push(e.label||EXP_CAT[e.category]||"Dépense",(e.supplier?e.supplier+" · ":"")+(EXP_CAT[e.category]||""),e.amount,e.currency,expFx(e),e.id); });
  (inv.items||[]).filter(t=>t.artworkId && state.artworks[t.artworkId]).forEach(t=>{
    const a=state.artworks[t.artworkId], q=num(t.qty||1)||1, forArt=exps.filter(e=>e.artworkId===a.id);
    const artE=forArt.filter(e=>e.category==="art"), comE=forArt.filter(e=>e.category==="commission");
    forArt.filter(e=>!used.has(e.id)).forEach(e=>{ used.add(e.id); push(e.label||EXP_CAT[e.category],(e.supplier?e.supplier+" · ":"")+EXP_CAT[e.category]+" · œuvre",e.amount,e.currency,expFx(e),e.id); });
    if(!artE.length && num(a.cost)) push((isConsigned(a)?"Net propriétaire · ":"Prix d’achat · ")+(a.artist||"")+" "+(a.title||""),"Fiche œuvre",num(a.cost)*q,a.costCurrency||a.currency||cur,a.costCurrency==="EUR"||(!a.costCurrency&&a.currency==="EUR")?a.costFx:undefined);
    const bv=num(a.brokerValue);
    if(!comE.length && bv){ const amt=(a.brokerMode||"pct")==="pct"? num(t.price)*q*bv/100 : bv; push("Intermédiaire"+(brokerName(a)?" · "+brokerName(a):""),"Fiche œuvre",amt,(a.brokerMode||"pct")==="pct"?cur:(a.currency||cur),undefined); }
  });
  const cost=lines.reduce((s,l)=>s+(l.conv||0),0);
  return {rev,cost,net:rev-cost,cur,lines,missing,netAED:toAED(rev-cost,cur,rate)};
}

function acctCard(k,aed,n,hl){ return `<div class="acard ${hl?"hl":""}"><div class="k">${k}</div><div class="v">${aed===null?"—":mAED(aed)}</div><div class="n">${aed!==null&&aed!==0?"≈ "+mUSD(aed)+(n?" · ":""):""}${n||""}</div></div>`; }
function renderAcct(){
  const el=$("#acct"); if(!el) return;
  const inv=sortedInvoices(), exps=sortedExpenses();
  const years=[...new Set([...inv.map(i=>(i.date||"").slice(0,4)),...exps.map(e=>(e.date||"").slice(0,4)),String(new Date().getFullYear())].filter(Boolean))].sort().reverse();
  const tabs=[["overview","Vue d’ensemble"],["sales","Ventes"],["expenses","Dépenses"],["margins","Marges"]];
  const noRate=[...inv.filter(i=>statusOf(i)!=="draft"&&invBaseAED(i)===null).map(i=>"facture "+(i.number||"")),...exps.filter(e=>expAED(e)===null).map(e=>"dépense "+(e.label||e.supplier||""))];
  let body="";

  else if(state.acctTab==="sales") body=acctSales(inv);

  el.innerHTML=`<div class="aw">
    <div class="ahead"><div><h1>Comptabilité</h1><p class="asub">Lecture des factures émises et des factures à payer · montants convertis en AED · 1 USD = 3,6725 AED (taux fixe) · autres devises au taux du jour de l’opération.</p></div>
      <select class="ayear" id="acctYear" aria-label="Année">${years.map(y=>`<option value="${y}" ${acctYear===y?"selected":""}>${y}</option>`).join("")}<option value="all" ${acctYear==="all"?"selected":""}>Toutes les années</option></select></div>
    <div class="seg aseg" role="tablist">${tabs.map(([k,v])=>`<button type="button" data-atab="${k}" class="${state.acctTab===k?"on":""}">${v}</button>`).join("")}</div>
    ${noRate.length?`<p class="awarn">Taux de change manquant pour ${noRate.length>2?noRate.length+" opérations":esc(noRate.join(", "))} : ${VIEWER?"Claude doit le renseigner.":"renseignez le taux AED de l’opération pour l’inclure."}</p>`:""}
    ${body}</div>`;

}
function acctOverview(inv,exps){
  const y=acctYear==="all"?"":" "+acctYear;
  const sales=inv.filter(i=>statusOf(i)!=="draft"&&inYear(i.date)), ex=exps.filter(e=>inYear(e.date));
  const sum=(l,f)=>l.reduce((s,x)=>s+(f(x)||0),0);
  const ca=sum(sales,invBaseAED), dep=sum(ex,expAED), res=ca-dep;
  const rate=i=>{ const t=totals(i).total; return t? (invTotalAED(i)||0)/t : 0; };
  const paid=inv.reduce((acc,i)=>{ if(statusOf(i)==="draft") return acc; const ps=i.payments||[];
      if(ps.length) return acc+ps.filter(x=>inYear(x.date)).reduce((a,x)=>a+num(x.amount)*rate(i),0);
      return acc+(i.status==="paid"&&inYear(i.paidDate||i.date)?(invTotalAED(i)||0):0); },0);
  const due=inv.filter(i=>["sent","late","partial"].includes(statusOf(i))), dueAED=due.reduce((a,i)=>a+balanceOf(i)*rate(i),0);
  const toPay=exps.filter(e=>expStatus(e)!=="paid"), toPayAED=sum(toPay,expBalAED);
  const paidOut=exps.reduce((acc,e)=>{ const f=expFx(e); if(!f) return acc; const ps=e.payments||[]; if(ps.length) return acc+ps.filter(x=>inYear(x.date)).reduce((a,x)=>a+num(x.amount)*f,0); return acc+(e.status==="paid"&&inYear(e.date)?num(e.amount)*f:0); },0);
  const cnt=(n,a,b)=>n+" "+(n>1?b:a);
  const byCat=EXP_CATS.map(([k,v])=>[k,v,sum(ex.filter(e=>e.category===k),expAED)]).filter(r=>r[2]).sort((a,b)=>b[2]-a[2]);
  const max=Math.max(1,...byCat.map(r=>r[2]));
  let period="";
  if(acctYear!=="all"){ const rows=[]; for(let m=1;m<=12;m++){ const p=acctYear+"-"+String(m).padStart(2,"0"); const c=sum(sales.filter(i=>(i.date||"").startsWith(p)),invBaseAED), d=sum(ex.filter(e=>(e.date||"").startsWith(p)),expAED); if(c||d) rows.push([new Date(p+"-15").toLocaleDateString("fr-FR",{month:"long"}),c,d]); }
    period=rows.length?`<h2><span>Par mois</span></h2><div class="tw"><table><thead><tr><th>Mois</th><th>Chiffre d’affaires</th><th>Dépenses</th><th>Résultat</th></tr></thead><tbody class="static">${rows.map(r=>`<tr><td style="text-transform:capitalize">${r[0]}</td><td>${mAED(r[1])}</td><td>${mAED(r[2])}</td><td class="${r[1]-r[2]<0?"neg":"pos"}">${mAED(r[1]-r[2])}</td></tr>`).join("")}</tbody></table></div>`:""; }
  return `<h2><span>Résultat${y}</span></h2>
    <div class="acards a3">${acctCard("Chiffre d’affaires HT",ca,cnt(sales.length,"facture","factures"))}${acctCard("Dépenses",dep,cnt(ex.length,"dépense","dépenses"))}${acctCard("Résultat",res,res<0?"perte":"bénéfice avant impôt",true)}</div>
    <h2><span>Trésorerie</span></h2>
    <div class="acards">${acctCard("Encaissé"+y,paid,"paiements clients reçus")}${acctCard("À encaisser",dueAED,cnt(due.length,"facture client","factures clients"))}${acctCard("Payé"+y,paidOut,"paiements fournisseurs")}${acctCard("À payer",toPayAED,cnt(toPay.length,"facture fournisseur","factures fournisseurs"))}</div>
    <h2><span>Dépenses par catégorie${y}</span></h2>
    ${byCat.length?`<div class="bars">${byCat.map(([k,v,a])=>`<button type="button" class="bar" data-expcat="${k}"><span class="bl">${esc(v)}</span><span class="bt"><i style="width:${Math.max(2,a/max*100)}%"></i></span><span class="bv">${mAED(a)}</span></button>`).join("")}</div>`:`<div class="aempty">Aucune dépense enregistrée${y}.</div>`}
    ${period}`;
}
function acctSales(inv){
  const list=inv.filter(i=>inYear(i.date));
  if(!list.length) return `<div class="aempty" style="margin-top:22px">Aucune facture sur cette période.</div>`;
  let ca=0;
  return `<h2><span>Factures de vente</span><span>${list.length}</span></h2><div class="tw"><table><thead><tr><th>Facture</th><th class="hide-sm">Date</th><th>Montant HT</th><th class="hide-sm">En AED</th><th class="hide-sm">Marge réelle</th><th>Statut</th></tr></thead><tbody>${list.map(i=>{ const s=statusOf(i), b=totals(i).base, a=invBaseAED(i), op=opOf(i); if(s!=="draft"&&a) ca+=a;
      const rateCell=i.currency==="EUR"?`<span class="rate">${VIEWER?(num(i.fxAED)?"1 € = "+esc(i.fxAED)+" AED":"taux ?"):`1 € = <input class="fxin" data-invfx="${i.id}" value="${esc(i.fxAED||"")}" inputmode="decimal" placeholder="4,00" aria-label="Taux EUR en AED"> AED`}</span>`:"";
      return `<tr data-openinv="${i.id}"><td><span class="ar">${esc(i.number||"Sans numéro")}</span><span class="cl">${esc(i.client?.name||i.client?.company||"Client à renseigner")}</span></td><td class="hide-sm">${esc(fdate(i.date,"fr"))}</td><td>${mC(b,i.currency)}${rateCell}${i.currency!=="AED"?`<small class="show-sm">${a===null?"taux ?":mAED(a)}</small>`:""}</td><td class="hide-sm">${a===null?"—":mAED(a)}</td><td class="hide-sm ${op.net<0?"neg":"pos"}">${op.lines.length?mC(op.net,op.cur)+" <small>"+pctTxt(op.net,op.rev)+"</small>":"<small>—</small>"}</td><td><span class="chip ${s}">${STATUS[s]}</span></td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td>Chiffre d’affaires HT (hors brouillons)</td><td class="hide-sm"></td><td>${mAED(ca)}</td><td class="hide-sm">${mAED(ca)}</td><td class="hide-sm"></td><td></td></tr></tfoot></table></div>
    <p class="anote">Montants hors TVA. Touchez une facture pour l’ouvrir.</p>`;
}
function acctExpenses(exps){
  const list=exps.filter(e=>inYear(e.date)&&(expCat==="all"||e.category===expCat));
  const tot=list.reduce((s,e)=>s+(expAED(e)||0),0);
  return `<div class="abar"><div class="filters">${[["all","Toutes"],...EXP_CATS].map(([k,v])=>`<button type="button" data-expcat="${k}" class="${expCat===k?"on":""}">${esc(v)}</button>`).join("")}</div>

    ${list.length?`<div class="tw"><table><thead><tr><th>Dépense</th><th class="hide-sm">Date</th><th class="hide-sm">Catégorie</th><th>Montant</th><th class="hide-sm">En AED</th><th class="hide-sm">Rattachée à</th></tr></thead><tbody>${list.map(e=>{ const a=expAED(e), i=state.invoices[e.invoiceId], w=state.artworks[e.artworkId];
      return `<tr data-exp="${e.id}"><td><span class="ar">${esc(e.supplier||"Fournisseur")}${e.files?.length?` <span class="clip" title="${e.files.length} justificatif(s)"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" style="vertical-align:-1px"><path d="M20 11.5l-8 8a5 5 0 01-7-7l8.5-8.5a3.3 3.3 0 014.7 4.7L9.7 17.2a1.7 1.7 0 01-2.4-2.4L15 7"/></svg>${e.files.length>1?e.files.length:""}</span>`:""}${expStatus(e)!=="paid"?` <span class="chip ${expStatus(e)==="late"?"late":"sent"}">${EXP_STATUS[expStatus(e)]}</span>`:""}</span><span class="cl">${esc(e.label||EXP_CAT[e.category]||"")}</span></td><td class="hide-sm">${esc(fdate(e.date,"fr"))}</td><td class="hide-sm">${esc(EXP_CAT[e.category]||"")}</td><td>${num(e.amount)?mC(num(e.amount),e.currency):"—"}${e.currency!=="AED"?`<small class="show-sm">${a===null?"taux ?":mAED(a)}</small>`:""}</td><td class="hide-sm">${a===null?"taux ?":mAED(a)}</td><td class="hide-sm lk">${i?esc(i.number||"Facture"):e.invoiceId?"Facture supprimée":""}${w?(i?"<br>":"")+esc(w.artist||"")+" · <i>"+esc(w.title||"")+"</i>":""}${!i&&!w&&!e.invoiceId?"<small>Frais généraux</small>":""}</td></tr>`; }).join("")}</tbody>
      <tfoot><tr><td>Total</td><td class="hide-sm"></td><td class="hide-sm"></td><td>${mAED(tot)}</td><td class="hide-sm">${mAED(tot)}</td><td class="hide-sm">≈ ${mUSD(tot)}</td></tr></tfoot></table></div>`
    :`<div class="aempty">${exps.length?"Aucune dépense dans ce filtre.":VIEWER?"Aucune dépense enregistrée pour l’instant.":"Aucune dépense pour l’instant. Ajoutez vos factures fournisseurs et notes de frais avec « Nouvelle dépense », ou envoyez-les à Claude."}</div>`}`;
}
function acctMargins(inv){
  const ops=inv.filter(i=>statusOf(i)!=="draft"&&inYear(i.date)).map(i=>({i,op:opOf(i)}));
  const withCosts=ops.filter(x=>x.op.lines.length), none=ops.filter(x=>!x.op.lines.length);
  const totAED=withCosts.reduce((s,x)=>s+(x.op.netAED||0),0);
  const arts=sortedArtworks(), stock=arts.filter(a=>["available","reserved","consignment"].includes(artStatus(a)));
  const st={}; let skipped=0; const srows=[];
  stock.forEach(a=>{ const r=finOf(a); if(r.missing||r.mismatch){ skipped++; return; } const t=st[r.cur]=st[r.cur]||{price:0,net:0}; t.price+=r.price; t.net+=r.net; srows.push({a,r}); });
  const stockAED=Object.entries(st).reduce((s,[c,t])=>s+(toAED(t.net,c)||0),0), stockVal=Object.entries(st).reduce((s,[c,t])=>s+(toAED(t.price,c)||0),0);
  return `<h2><span>Marge réelle par opération</span><span>${withCosts.length}</span></h2>
    <div class="acards a3" style="margin-bottom:10px">${acctCard("Marge nette réalisée",withCosts.length?totAED:null,withCosts.length+" opération"+(withCosts.length>1?"s":"")+" avec coûts",true)}</div>
    ${withCosts.length?`<div class="tw"><table><thead><tr><th>Opération</th><th>Facturé HT</th><th class="hide-sm">Coûts</th><th>Marge</th><th>%</th></tr></thead><tbody>${withCosts.map(({i,op})=>`<tr data-op="${i.id}"><td><span class="ar">${esc(i.number||"")}</span><span class="cl">${esc(i.client?.name||i.client?.company||"")}</span></td><td>${mC(op.rev,op.cur)}</td><td class="hide-sm">${mC(op.cost,op.cur)}${op.missing?" <small>+ taux ?</small>":""}</td><td class="${op.net<0?"neg":"pos"}">${mC(op.net,op.cur)}</td><td>${pctTxt(op.net,op.rev)}</td></tr>`).join("")}</tbody></table></div><p class="anote">Touchez une opération pour voir le détail des coûts. Chaque coût est converti dans la devise de la facture.</p>`
      :`<div class="aempty">Aucune opération avec des coûts rattachés. Rattachez une dépense à une facture de vente (ou renseignez le prix d’achat d’une œuvre facturée) pour voir la marge réelle.</div>`}
    ${none.length?`<p class="anote">${none.length} facture${none.length>1?"s":""} sans coût rattaché : ${none.map(x=>esc(x.i.number||"")).join(", ")}.</p>`:""}

    <div class="acards a3" style="margin-bottom:10px">${acctCard("Valeur du stock (prix finaux)",srows.length?stockVal:null,"available · reserved · consignment")}${acctCard("Marge nette potentielle",srows.length?stockAED:null,srows.length+" œuvre"+(srows.length>1?"s":""),true)}</div>
    ${srows.length?`<div class="tw"><table><thead><tr><th>Œuvre</th><th>Prix final</th><th class="hide-sm">Coût / net propr.</th><th>Marge nette</th><th>%</th></tr></thead><tbody>${srows.map(({a,r})=>`<tr data-art-open="${a.id}"><td><span class="ar">${esc(a.artist||"Artiste")}</span><span class="ti">${esc(a.title||"Sans titre")}${a.year?", "+esc(a.year):""}</span></td><td>${mC(r.price,r.cur)}</td><td class="hide-sm">${r.hasCost?mC(r.cost,r.cur):"—"}</td><td class="${r.net<0?"neg":"pos"}">${mC(r.net,r.cur)}</td><td>${pctTxt(r.net,r.price)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="aempty">Aucune œuvre en vente avec un prix renseigné.</div>`}
    ${skipped?`<p class="anote">${skipped} œuvre${skipped>1?"s":""} non comptée${skipped>1?"s":""} (prix manquant ou devises différentes).</p>`:""}`;

let payFilter="open", payCat="all";
function facSeg(on){ return `<div class="seg fseg" role="tablist"><button type="button" data-fseg="invoices" class="${on==="invoices"?"on":""}">Émises · clients</button><button type="button" data-fseg="payables" class="${on==="payables"?"on":""}">À payer · fournisseurs</button></div>`; }
function renderPay(){
  const el=$("#pay"); if(!el) return;
  const all=sortedExpenses(), y=String(new Date().getFullYear());
  const open=all.filter(e=>expStatus(e)!=="paid"), late=all.filter(e=>expStatus(e)==="late");
  const sumA=(l,f)=>l.reduce((a,e)=>a+(f(e)||0),0);

async function fileBlob(f){
  if(!VIEWER){ const r=await fetch("/_blob/"+f.id); if(!r.ok) throw new Error("missing"); return await r.blob(); }
  try{ const c=await idb.get("f:"+f.id); if(c) return c; }catch(e){}
  let r; try{ const ctl=new AbortController(); setTimeout(()=>ctl.abort(),20000); r=await fetch("files/"+f.id+".enc",{signal:ctl.signal}); }catch(e){ throw new Error("offline"); } if(!r.ok) throw new Error("offline");
  const env=await r.json(), key=await idb.get("privkey");
  const raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},key,b64d(env.ek));
  const aes=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(env.iv)},aes,b64d(env.ct));
  const blob=new Blob([plain],{type:f.type||env.type||"application/octet-stream"}); try{ await idb.set("f:"+f.id,blob); }catch(e){} return blob;
}

function subscribeColl(coll){

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function lockUI(){ if(!VIEWER) return; document.querySelectorAll("#editor input,#editor select,#editor textarea,#detail input,#detail select,#detail textarea").forEach(el=>{ el.disabled=true; if(el.type==="date"&&!el.value) el.type="text"; }); }
async function unlockWithCode(code){
  const r=await fetch("key.enc?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("nokey"); const k=await r.json();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const aes=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(k.salt),iterations:k.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pk=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(k.iv)},aes,b64d(k.ct));
  const key=await crypto.subtle.importKey("pkcs8",pk,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);
  await idb.set("privkey",key); return key;
}
function askCode(){ return new Promise(res=>{
  const d=document.createElement("div"); d.id="lockScreen";
  d.innerHTML=`<form class="lk"><img src="${LOGO_GOLD}" alt="Legacy Shaper"><div style="font:500 26px/1.1 var(--serif)">The Legacy</div><div class="lm" style="color:rgba(243,238,223,.85)">Entrez votre code d’accès. Il n’est demandé qu’une fois sur cet appareil.</div><input type="password" id="lkCode" autocomplete="current-password" placeholder="Code d’accès" aria-label="Code d’accès"><button type="submit">Déverrouiller</button><div class="lm" id="lkMsg"></div></form>`;
  document.body.appendChild(d); const inp=d.querySelector("#lkCode"); setTimeout(()=>inp.focus(),50);
  d.querySelector("form").onsubmit=async e=>{ e.preventDefault(); const m=d.querySelector("#lkMsg"); m.textContent="Vérification…";
    try{ const key=await unlockWithCode(inp.value); d.remove(); res(key); }
    catch(err){ m.textContent = err.message==="nokey" ? "Connexion internet nécessaire pour le premier déverrouillage." : "Code incorrect. Réessayez."; inp.select(); } };
}); }
async function viewerSync(manual){
  let key=null; try{ key=await idb.get("privkey"); }catch(e){}
  if(!key){ key=await askCode(); }
  let res; try{ const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),12000); res=await fetch("data.enc?t="+Date.now(),{cache:"no-store",signal:ctl.signal}); clearTimeout(to); }catch(e){ res=null; }
  const stamp=iso=>iso?new Date(iso).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
  if(!res||!res.ok){ const last=await idb.get("exportedAt").catch(()=>null); setSave(last?`Hors ligne · données du ${stamp(last)}`:"Hors ligne"); return; }
  try{
    const env=await res.json(); const last=await idb.get("exportedAt").catch(()=>null);
    if(!manual && last && env.exportedAt<=last){ setSave(`Données à jour au ${stamp(last)}`); return; }
    let raw; try{ raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},key,b64d(env.ek)); }
    catch(e){ await idb.set("privkey",null).catch(()=>{}); key=await askCode(); raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},key,b64d(env.ek)); }
    const aes=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(env.iv)},aes,b64d(env.ct));
    const d=JSON.parse(new TextDecoder().decode(plain));
    state.company=mergeCompany(d.company); state.invoices=d.invoices||{}; state.contacts=d.contacts||{}; state.artworks=d.artworks||{}; state.views=d.views||{}; state.expenses=d.expenses||{};
    await local.write(); await idb.set("exportedAt",env.exportedAt);
    if(!state.invoices[state.current]) state.current=sortedInvoices()[0]?.id||null;
    if(state.view==="invoices") renderAll(); else renderAlt(); lockUI();
    setSave(`Données à jour au ${stamp(env.exportedAt)}`);
  }catch(e){ setSave("Mise à jour impossible : réessayez plus tard",true); }
}

(async function boot(){
  const saved=await local.read();
  if(saved){ state.company=mergeCompany(saved.company); state.invoices=saved.invoices||{}; state.contacts=saved.contacts||{}; state.artworks=saved.artworks||{}; state.views=saved.views||{}; state.expenses=saved.expenses||{}; }

  let v0="invoices"; try{ v0=localStorage.getItem("ls-view")||"invoices"; }catch(e){}

  if(VIEWER){
    document.body.classList.add("viewer"); const rb=$("#btnRefresh"); rb.hidden=false; rb.onclick=()=>{ setSave("Mise à jour…"); viewerSync(true); };

  }
  setSave("Connexion…");
  const use = window.claude?.use ? window.claude.use.bind(window.claude) : null;
  if(!use){ setSave("Enregistré sur cet appareil"); return; }
  use("downloads").then(d=>{ downloads=d; }).catch(()=>{});
  use("assets").then(a=>{ assetsCap=a; }).catch(()=>{});
  use("db").then(d=>{
    if(!d){ setSave("Enregistré sur cet appareil"); return; }
    db=d; state.invoices={}; state.contacts={}; state.artworks={}; state.expenses={}; let first=true;
    subscribeColl("contacts"); subscribeColl("artworks"); subscribeColl("expenses");
    db.doc("settings/company").onSnapshot(s=>{ if(s.exists && !window.__cancelSettings){ state.company=mergeCompany(clone(s.data())); renderPreview(); const a=document.activeElement; if(!first && (!a||!a.dataset?.p)) renderEditor(); } },()=>{});
    db.collection("invoices").onSnapshot(snap=>{
      let curChanged=false;
      snap.docChanges().forEach(ch=>{
        const id=ch.doc.id;
        if(ch.type==="removed"){ if(!pending(id)){ delete state.invoices[id]; if(id===state.current) curChanged=true; } return; }
        if(pending(id)) return;
        const data=clone(ch.doc.data());
        if(JSON.stringify(state.invoices[id])===JSON.stringify(data)) return;
        state.invoices[id]=data; if(id===state.current) curChanged=true;
      });
      if(first){ first=false; if(!state.invoices[state.current]) state.current=sortedInvoices()[0]?.id||null; if(state.view==="invoices") renderAll(); else renderAlt(); setSave("Enregistré"); return; }
      if(state.view!=="invoices"){ renderAlt(); return; }
      renderList();
      if(curChanged){ if(!state.invoices[state.current]) state.current=sortedInvoices()[0]?.id||null; const a=document.activeElement; if(!a||!a.dataset?.p){ renderEditor(); } renderPreview(); }
    },err=>{ setSave("Synchronisation interrompue, rechargez la page",true); });
  }).catch(()=>setSave("Enregistré sur cet appareil"));
})();
